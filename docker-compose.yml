services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-downloader
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot_downloads:/app/downloads
      - bot_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_downloads:
  bot_data:

