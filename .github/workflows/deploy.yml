name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Bot
    runs-on: [self-hosted, linux]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Preserve SQLite databases before checkout
        run: |
          mkdir -p /tmp/tg_bot_db_backup
          if [ -d data ]; then
            cp -n data/*.db /tmp/tg_bot_db_backup/ 2>/dev/null || true
            echo "Backed up existing SQLite databases from data/ to /tmp/tg_bot_db_backup/"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Restore SQLite databases after checkout
        run: |
          mkdir -p data
          if [ -d /tmp/tg_bot_db_backup ]; then
            cp -n /tmp/tg_bot_db_backup/*.db data/ 2>/dev/null || true
            echo "Restored SQLite databases to data/"
          fi

      - name: Generate .env configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS || secrets.ALLOWED_CHAT_IDS }}
          TELEGRAM_API_ID: ${{ vars.TELEGRAM_API_ID || secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ vars.TELEGRAM_API_HASH || secrets.TELEGRAM_API_HASH }}
          LOCAL_BOT_API_URL: ${{ vars.LOCAL_BOT_API_URL || secrets.LOCAL_BOT_API_URL }}
          MUNITO_API_KEY: ${{ secrets.MUNITO_API_KEY || vars.MUNITO_API_KEY }}
          MUNITO_MODEL: ${{ vars.MUNITO_MODEL || secrets.MUNITO_MODEL }}
          MUNITO_BASE_URL: ${{ vars.MUNITO_BASE_URL || secrets.MUNITO_BASE_URL }}
        run: |
          cat << EOF > .env
          BOT_TOKEN=${BOT_TOKEN}
          ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS}
          TELEGRAM_API_ID=${TELEGRAM_API_ID}
          TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
          LOCAL_BOT_API_URL=${LOCAL_BOT_API_URL}
          MUNITO_API_KEY=${MUNITO_API_KEY}
          MUNITO_MODEL=${MUNITO_MODEL}
          MUNITO_BASE_URL=${MUNITO_BASE_URL}
          EOF
          chmod 600 .env

      - name: Configure cookies
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES || secrets.COOKIES || secrets.COOKIES_TXT }}
        run: |
          mkdir -p data
          if [ -n "$INSTAGRAM_COOKIES" ]; then
            printf '%s\n' "$INSTAGRAM_COOKIES" > data/cookies.txt
            chmod 600 data/cookies.txt
            echo "Successfully configured cookies.txt in data/"
          fi

      - name: Build and start container
        run: |
          docker compose build --pull
          docker compose up -d --remove-orphans

      - name: Prune unused images
        run: docker image prune -f

      - name: Verify container health
        run: |
          sleep 3
          docker compose ps
          if docker compose ps | grep -iE "exit|restarting"; then
            echo "Error: Container crashed on startup!"
            docker compose logs --tail 50
            exit 1
          fi
