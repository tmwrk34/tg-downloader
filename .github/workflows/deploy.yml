name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Bot
    runs-on: [self-hosted, linux]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS || secrets.ALLOWED_CHAT_IDS }}
          TELEGRAM_API_ID: ${{ vars.TELEGRAM_API_ID || secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ vars.TELEGRAM_API_HASH || secrets.TELEGRAM_API_HASH }}
          LOCAL_BOT_API_URL: ${{ vars.LOCAL_BOT_API_URL || secrets.LOCAL_BOT_API_URL }}
        run: |
          cat << EOF > .env
          BOT_TOKEN=${BOT_TOKEN}
          ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS}
          TELEGRAM_API_ID=${TELEGRAM_API_ID}
          TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
          LOCAL_BOT_API_URL=${LOCAL_BOT_API_URL}
          EOF
          chmod 600 .env

      - name: Build and start container
        run: |
          docker compose build --pull
          docker compose up -d --remove-orphans

      - name: Prune unused images
        run: docker image prune -f

      - name: Verify container health
        run: |
          sleep 3
          docker compose ps
          if docker compose ps | grep -iE "exit|restarting"; then
            echo "Error: Container crashed on startup!"
            docker compose logs --tail 50
            exit 1
          fi
