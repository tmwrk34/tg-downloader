[project]
name = "tg-downloader"
version = "0.1.0"
description = "A Telegram bot for downloading media"
readme = "README.md"
authors = [
    { name = "An Paranoid", email = "annnparanoid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "curl-cffi>=0.16.0",
    "python-dotenv>=1.2.4",
    "yt-dlp>=2026.10.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
